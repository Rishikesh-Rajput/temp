<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Registration</title>
    <link rel="Stylesheet" href="style.css"></link>
    <script src="script.js"></script>
</head>
<body>
    <h2>Student Registration</h2>
    <form id="myForm">
        <label for="name">Name</label>
        <input type="text" id="name" align="center" name="name" required><br><br>

        <label for="roll">Roll No</label>
        <input type="text" id="roll" align="center" name="roll" required><br><br>

        <label for="branch">Branch</label>
        <input type="text" id="branch" align="center" name="branch" required><br><br>

        <button type="button" onclick="submitForm()">Submit</button>
    </form>
    <p id="Confirmation"></p>
</body>
</html>
